# Platform services only. User apps are created dynamically by the worker, not declared here.
# Dev: ports are bound to 127.0.0.1 so nothing is reachable from the LAN.
#
# Run everything:  docker compose -f infrastructure/compose.yaml --env-file infrastructure/.env up -d --build
# Develop with npm run dev / npm start instead:  ... up -d postgres redis   (NOT a bare `up -d`: that also starts
# api and worker, which would compete with the npm ones for port 4000 and for the same queue).
# Extra settings for the containers in infrastructure/.env: DOCKER_GID (worker; see its comment, defaults to 999),
# GITHUB_APP_PRIVATE_KEY_FILE (host path of the .pem; optional), API_HOST_PORT (default 4000).
# The dashboard (`web`): http://localhost:8080 by default (WEB_HOST_PORT, WEB_BIND). Set WEB_ORIGIN to the exact address you open.

x-api-build: &api-build
  context: ..
  dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shipdok_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - shipdok_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Applies database migrations, then exits. api and worker wait for it.
  migrate:
    build: *api-build
    image: shipdok-api # not under shipdok/: that prefix is reserved for deployed apps (image cleanup will target it)
    command: ["node", "src/db/migrate.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  api:
    build: *api-build
    image: shipdok-api
    restart: unless-stopped
    init: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      API_HOST: 0.0.0.0 # inside the container; the published port below is what stays on loopback
      API_PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_SECRETS_KEY: ${APP_SECRETS_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_HOST_PORT:-8080}}
      TRUST_PROXY: loopback,uniquelocal # the dashboard's nginx (a private address) passes on the real client address
      PORT_RANGE: ${PORT_RANGE:-} # host ports chosen automatically for new apps (default 20000-20999)
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_ID:+/run/secrets/github-app.pem} # only when an App ID is set: a key path alone is a configuration error
      LOG_DIR: /var/lib/shipdok/logs
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000" # loopback only; the Cloudflare tunnel (cloudflared) is what reaches the webhook
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:/run/secrets/github-app.pem:ro
      - shipdok_logs:/var/lib/shipdok/logs # the worker writes logs; the API reads them and deletes a finished deployment's on request
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  # Clones, builds and runs user apps. It is the ONLY service that gets the Docker socket, which is root-equivalent
  # on the host: never add it to api or web.
  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: shipdok-worker
    restart: unless-stopped
    init: true # reaps the git/docker child processes
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # The container user is not root, so it needs the group that owns the socket. The number differs per machine:
    #   stat -c %g /var/run/docker.sock       (put the result in infrastructure/.env as DOCKER_GID)
    group_add:
      - ${DOCKER_GID:-999}
    # Health checks reach a new container through its published host port. Inside this container 127.0.0.1 is
    # the worker itself, so go through the host instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HEALTH_CHECK_HOST: host.docker.internal
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-15000} # how often crashes and health are checked
      STATS_INTERVAL_MS: ${STATS_INTERVAL_MS:-15000} # how often CPU and memory of running apps are measured
      LOG_DIR: /var/lib/shipdok/logs
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_SECRETS_KEY: ${APP_SECRETS_KEY}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_ID:+/run/secrets/github-app.pem} # only when an App ID is set: a key path alone is a configuration error
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:/run/secrets/github-app.pem:ro
      - shipdok_logs:/var/lib/shipdok/logs

  # The dashboard. nginx serves the built files and forwards /api to the API, so the browser sees one origin (cookies just
  # work, no CORS). By default it listens on this machine only; to reach it from other devices on your LAN or VPN set
  # WEB_BIND to this machine's address (or 0.0.0.0) AND WEB_ORIGIN to the address you will open in the browser.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: shipdok-web
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_HOST_PORT:-8080}:80"

volumes:
  shipdok_pgdata:
  shipdok_redisdata:
  shipdok_logs: # deployment logs: kept until the deployment is deleted. Back this up like the database if you care about them
