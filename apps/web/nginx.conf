# Serves the dashboard and forwards /api to the API, so the browser sees ONE origin: the session cookie just works and
# there is no CORS. The API itself is never published to the network by this setup.
# The scheme the visitor really used: a trusted proxy in front (Nginx Proxy Manager, a tunnel) terminates https and says so.
# Without one, this server's own scheme. (A visitor who lies only breaks their own cookie.)
map $http_x_forwarded_proto $shipdok_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# A proxy in the middle that did NOT say who the visitor is (it sent X-Real-IP, CF-Connecting-IP, True-Client-IP or Forwarded but no
# X-Forwarded-For) must not pass for a local visitor: this server's own view of the connection would be a private address. So the
# address handed to the API becomes 192.0.2.1 (a documentation address, never local), which makes the API treat the visitor as outside.
map "$http_x_forwarded_for|$http_x_real_ip|$http_cf_connecting_ip|$http_true_client_ip|$http_forwarded" $shipdok_hidden_proxy {
  "~^\|{4}$" 0;   # no proxy headers at all: a direct visitor
  "~^\|"     1;   # proxy headers, but X-Forwarded-For is empty
  default    0;
}
# Whether the visitor's own request already carried X-Forwarded-For (a proxy vouching for who they are). This server adds an address
# of its own to every request, so the API needs this to tell a proxied visitor from a direct one when the public name was used.
map $http_x_forwarded_for $shipdok_proxied {
  ""      0;
  default 1;
}
map $shipdok_hidden_proxy $shipdok_client {
  1       192.0.2.1;
  default $remote_addr;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Who is really connecting. A proxy on this machine or the local network (Nginx Proxy Manager, a tunnel) reports the visitor in
  # X-Forwarded-For; believe it only from those addresses, and take the right-most address that is not one of them, so a visitor
  # cannot invent their own. The API then sees the real visitor (for the lockout, the sign-in list and who counts as outside).
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from ::1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Docker's own DNS, asked again every few seconds: if the api container is recreated (new address) this keeps working.
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  # Everything comes from this origin. (Inline styles are allowed because the toast library injects some.)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com" always;

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;          # no URI part: the request goes through unchanged
    proxy_http_version 1.1;
    proxy_set_header Host $http_host; # with the port: the API compares it with the browser's Origin
    # Overwritten, never appended: a client cannot forge the address the API's rate limits count.
    proxy_set_header X-Forwarded-For $shipdok_client;
    proxy_set_header X-Shipdok-Proxied $shipdok_proxied;
    proxy_set_header X-Forwarded-Proto $shipdok_proto;
    proxy_read_timeout 60s;
    client_max_body_size 200k;
  }

  # The pages are served from here, not by the API, so before serving one ask the API whether this visitor may see the dashboard
  # at all (it answers 204 or 403 from the "who may reach Shipdok from outside" setting). A refusal looks like a missing page.
  location = /_visitor_check {
    internal;
    set $api_upstream http://api:4000;
    rewrite ^ /api/_visitor break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host; # with the port: the API compares it with the browser's Origin
    proxy_set_header X-Forwarded-For $shipdok_client;
    proxy_set_header X-Shipdok-Proxied $shipdok_proxied;
    proxy_set_header X-Forwarded-Proto $shipdok_proto;
  }
  error_page 403 = @hidden;
  location @hidden {
    default_type application/json;
    return 404 '{"error":"Not found"}';
  }

  # Built files carry a hash in their name, so they can be cached for good.
  location /assets/ {
    auth_request /_visitor_check;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Anything else is a page of the app (React Router decides): always the current index.html.
  location / {
    auth_request /_visitor_check;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://github.com" always;
    try_files $uri /index.html;
  }
}
