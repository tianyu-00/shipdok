# Builds the three Shipdok images (api, worker, web) for amd64 and ARM64 and publishes them.
#   - Only a push to the `publish` branch runs this: it builds AND publishes the images to GitHub's container registry (ghcr.io), tagged `latest`, the
#     number in the VERSION file, and sha-<commit>, then creates the GitHub Release.
#   - A push to `main` runs nothing (building the same images twice only used up the monthly allowance of Actions minutes). Check the images yourself
#     before publishing: `npm run check-images` builds the three images here and runs the same secret check (this machine's architecture only).
# Every image is checked first for files that must never be published (.env, private keys, jar.txt).
name: images

on:
  push:
    branches: [publish]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/publish' }} # never cancel a release half way

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/publish' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lower case)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shipdok-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for this machine and check for secrets
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          load: true
          tags: shipdok-check:${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - run: sh .github/scripts/check-image.sh shipdok-check:${{ matrix.image }}

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}
            type=sha
          labels: |
            org.opencontainers.image.title=shipdok-${{ matrix.image }}

      - name: Build for amd64 and ARM64 (published only from the publish branch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # After all three images are published: a GitHub Release (and the tag v<VERSION>) with notes of what changed since the last release.
  # Publishing the same VERSION again updates the images but not the Release: bump VERSION for a new release.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          case "$VERSION" in
            *[!0-9A-Za-z.-]* | '') echo "VERSION is not a version number: $VERSION" >&2; exit 1 ;;
          esac
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; its images were updated, the release page was left as it is. Bump VERSION for a new release."
            exit 0
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          cat > notes.md <<NOTES
          Images for **linux/amd64** and **linux/arm64**:

          \`\`\`
          ghcr.io/$OWNER/shipdok-api:$VERSION
          ghcr.io/$OWNER/shipdok-worker:$VERSION
          ghcr.io/$OWNER/shipdok-web:$VERSION
          \`\`\`

          Run this version: \`SHIPDOK_VERSION=$VERSION docker compose -f infrastructure/compose.yaml up -d\`
          NOTES
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Shipdok v$VERSION" --notes-file notes.md --generate-notes
