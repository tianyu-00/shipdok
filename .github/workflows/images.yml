# Builds the three Shipdok images (api, worker, web) for amd64 and ARM64.
#   - A push to the `publish` branch builds AND publishes them to GitHub's container registry (ghcr.io), tagged `latest`, the number in the
#     VERSION file, and sha-<commit>.
#   - A push to `main` or a pull request only builds (nothing is published), so a broken Dockerfile shows up early.
# Every image is checked first for files that must never be published (.env, private keys, jar.txt).
name: images

on:
  push:
    branches: [main, publish]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/publish' }} # never cancel a release half way

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/publish' }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry names must be lower case)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shipdok-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for this machine and check for secrets
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          load: true
          tags: shipdok-check:${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - run: sh .github/scripts/check-image.sh shipdok-check:${{ matrix.image }}

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.VERSION }}
            type=sha
          labels: |
            org.opencontainers.image.title=shipdok-${{ matrix.image }}

      - name: Build for amd64 and ARM64 (published only from the publish branch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
